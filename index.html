<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测测你是《后会友期》里的谁？</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e8734a'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='%23ffffff' font-family='sans-serif'%3E友%3C/text%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #faf6f0;
    --card: #ffffff;
    --text: #2d2a26;
    --sub: #8a8278;
    --accent: #e8734a;
    --accent-light: #fde8dd;
    --brown: #6b4e3d;
    --line: #e8e0d5;
  }
  body {
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }
  .container { max-width: 480px; margin: 0 auto; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; }

  .home { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 40px 0; }
  .home .tag { font-size: 13px; color: var(--accent); letter-spacing: 2px; margin-bottom: 16px; }
  .home h1 { font-size: 28px; font-weight: 800; line-height: 1.4; margin-bottom: 12px; }
  .home h1 span { color: var(--accent); }
  .home .desc { font-size: 14px; color: var(--sub); line-height: 1.8; margin-bottom: 28px; max-width: 330px; }
  .home .chars { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 32px; }
  .home .chars span { font-size: 12px; padding: 5px 12px; background: var(--accent-light); color: var(--brown); border-radius: 20px; }
  .btn-start {
    width: 100%; max-width: 280px; padding: 16px; background: var(--accent); color: #fff;
    border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn-start:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(232,115,74,0.3); }
  .home .note { font-size: 12px; color: var(--sub); margin-top: 16px; }

  .quiz { flex: 1; display: none; flex-direction: column; }
  .quiz.active { display: flex; }
  .progress-bar { height: 4px; background: var(--line); border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
  .progress-bar .fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; }
  .quiz .q-num { font-size: 13px; color: var(--accent); font-weight: 600; margin-bottom: 8px; }
  .q-head { display: flex; justify-content: space-between; align-items: center; }
  .btn-prev {
    background: none; border: none; font-size: 13px; color: var(--sub);
    cursor: pointer; padding: 4px 8px; font-family: inherit;
  }
  .btn-prev:hover { color: var(--accent); }
  .btn-prev:disabled { opacity: 0.35; cursor: default; }
  .quiz .q-text { font-size: 20px; font-weight: 700; line-height: 1.5; margin-bottom: 28px; }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .opt {
    padding: 16px 18px; background: var(--card); border: 2px solid var(--line); border-radius: 14px;
    font-size: 15px; cursor: pointer; transition: all 0.2s; text-align: left; line-height: 1.5;
  }
  .opt:hover { border-color: var(--accent); background: var(--accent-light); }
  .opt .label { display: inline-block; width: 24px; height: 24px; line-height: 24px; text-align: center; background: var(--line); border-radius: 50%; font-size: 12px; font-weight: 700; margin-right: 10px; color: var(--brown); }
  .opt:hover .label { background: var(--accent); color: #fff; }

  .result { flex: 1; display: none; flex-direction: column; align-items: center; text-align: center; padding: 20px 0; }
  .result.active { display: flex; }
  .result .r-tag { font-size: 13px; color: var(--sub); margin-bottom: 12px; }
  .result .r-char { font-size: 14px; color: var(--accent); font-weight: 600; margin-bottom: 8px; }
  .result .r-name { font-size: 32px; font-weight: 800; margin-bottom: 4px; }
  .result .r-title { font-size: 16px; color: var(--brown); margin-bottom: 24px; font-weight: 600; white-space: nowrap; }
  .result .r-emoji { font-size: 60px; margin-bottom: 16px; }
  .result .r-avatar { width: 132px; height: 132px; border-radius: 50%; object-fit: cover; margin-bottom: 16px; }
  .result .h-avatar { width: 132px; height: 132px; border-radius: 50%; object-fit: cover; margin: 6px 0 4px; }
  .result-card {
    background: var(--card); border-radius: 20px; padding: 24px; width: 100%; text-align: left;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06); margin-bottom: 20px;
  }
  .result-card h3 { font-size: 15px; color: var(--accent); margin-bottom: 10px; }
  .result-card p { font-size: 14px; color: var(--text); line-height: 1.8; margin-bottom: 12px; }
  .result-card .traits { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .result-card .traits span { font-size: 12px; padding: 4px 10px; background: var(--accent-light); color: var(--brown); border-radius: 12px; }
  .result .btn-again {
    width: 100%; max-width: 280px; padding: 14px; background: transparent; color: var(--accent);
    border: 2px solid var(--accent); border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer;
    margin-top: 8px;
  }
  .result .btn-again:hover { background: var(--accent-light); }
  .result .btn-share {
    width: 100%; max-width: 280px; padding: 14px; background: var(--accent); color: #fff;
    border: none; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer;
    margin-top: 10px;
  }
  .result .btn-share:hover { opacity: 0.9; }

  /* 隐藏款 */
  .h-kicker { font-size: 13px; color: var(--accent); letter-spacing: 2px; margin-bottom: 14px; }
  .h-role { font-size: 12.5px; color: var(--sub); letter-spacing: 1px; margin-bottom: 6px; }
  .h-name { font-size: 38px; font-weight: 800; letter-spacing: 3px; line-height: 1.3; margin-bottom: 10px; }
  .h-tagline { font-size: 14px; color: var(--brown); line-height: 1.7; max-width: 350px; margin-bottom: 4px; white-space: nowrap; }
  .h-tagline b { color: var(--accent); font-weight: 600; }
  .hidden-side { margin-top: 4px; }
  .hidden-side p { margin-bottom: 0; }

  .loading { display: none; text-align: center; padding: 60px 0; }
  .loading.active { display: block; }
  .loading .dot { display: inline-block; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; margin: 0 4px; animation: bounce 1.4s infinite ease-in-out; }
  .loading .dot:nth-child(2) { animation-delay: 0.2s; }
  .loading .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
  .loading p { margin-top: 16px; color: var(--sub); font-size: 14px; }
</style>
</head>
<body>
<div class="container">

  <!-- 首页 -->
  <div class="home" id="home">
    <div class="tag">芒果TV《后会友期》</div>
    <h1>测测你是<br>节目里的<span>哪个人物</span>？</h1>
    <p class="desc">从边界、表达、信任、付出和关系修复这些日常场景出发，看看你更接近节目中哪一种友情相处风格。人物标签只提炼节目已播内容里的关系应对方式，不等于嘉宾完整的现实人格。</p>
    <div class="chars">
      <span>马天宇</span><span>张萌</span><span>许飞</span><span>白小纯</span>
      <span>青稚</span><span>王子璇</span><span>文吉儿</span><span>厉娜</span>
    </div>
    <button class="btn-start" onclick="startQuiz()">开始测试</button>
    <p class="note">约需4分钟 · 选最常出现的第一反应，不必选“最好”的答案</p>
  </div>

  <!-- 答题页 -->
  <div class="quiz" id="quiz">
    <div class="progress-bar"><div class="fill" id="progress"></div></div>
    <div class="q-head">
      <div class="q-num" id="qNum">第 1 题 / 共 20 题</div>
      <button class="btn-prev" id="btnPrev" onclick="prevQuestion()">‹ 上一题</button>
    </div>
    <div class="q-text" id="qText"></div>
    <div class="options" id="options"></div>
  </div>

  <!-- 加载 -->
  <div class="loading" id="loading">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <p>正在分析你的友情人格…</p>
  </div>

  <!-- 结果页 -->
  <div class="result" id="result"></div>

</div>

// ===== 逻辑 =====
let current = 0;
let scores = {};      // 总分
let primary = {};     // 只记主分（2分项），用于平分时裁决
let history = [];     // 每题所选的分值对象，用于回退
let obsCount = 0;      // 旁观指数：触发隐藏款张泉灵

function blank() {
  return { mayu: 0, zhangmeng: 0, xufei: 0, baixiaochun: 0, qingzhi: 0, wangzixuan: 0, wenjier: 0, lina: 0 };
}

function startQuiz() {
  document.getElementById('home').style.display = 'none';
  document.getElementById('quiz').classList.add('active');
  current = 0;
  scores = blank();
  primary = blank();
  history = [];
  obsCount = 0;
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[current];
  document.getElementById('progress').style.width = (current / QUESTIONS.length * 100) + '%';
  document.getElementById('qNum').textContent = `第 ${current + 1} 题 / 共 ${QUESTIONS.length} 题`;
  document.getElementById('btnPrev').disabled = (current === 0);
  document.getElementById('qText').textContent = q.q;
  const optsEl = document.getElementById('options');
  optsEl.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'opt';
    div.innerHTML = `<span class="label">${'ABCD'[i]}</span>${opt.t}`;
    div.onclick = () => selectOption(opt);
    optsEl.appendChild(div);
  });
  // 滚动回顶部，长选项时不至于看不到题干
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function selectOption(opt) {
  const s = opt.scores;
  for (const k in s) {
    scores[k] += s[k];
    if (s[k] === 2) primary[k] += 2;   // 主分单独记
  }
  if (opt.obs) obsCount++;
  history[current] = { scores: s, obs: !!opt.obs };
  current++;
  if (current < QUESTIONS.length) {
    renderQuestion();
  } else {
    document.getElementById('progress').style.width = '100%';
    showLoading();
  }
}

function prevQuestion() {
  if (current === 0) return;
  current--;
  const rec = history[current];
  if (rec) {
    const s = rec.scores;
    for (const k in s) {
      scores[k] -= s[k];
      if (s[k] === 2) primary[k] -= 2;
    }
    if (rec.obs) obsCount--;
  }
  history.length = current;
  renderQuestion();
}

function showLoading() {
  document.getElementById('quiz').classList.remove('active');
  document.getElementById('loading').classList.add('active');
  setTimeout(showResult, 1500);
}

// 每个角色的理论最高分（归一化用，抵消各角色上限差异）
function calcMax() {
  const mx = blank();
  QUESTIONS.forEach(q => {
    const per = blank();
    q.opts.forEach(o => {
      for (const k in o.scores) per[k] = Math.max(per[k], o.scores[k]);
    });
    for (const k in per) mx[k] += per[k];
  });
  return mx;
}

// 排序：先比匹配度（得分率），再比原始分，再比主分
function rankingOf() {
  const mx = calcMax();
  return Object.keys(scores)
    .map(k => ({ k, v: scores[k], mx: mx[k], rate: scores[k] / (mx[k] || 1), p: primary[k] }))
    .sort((a, b) => (b.rate - a.rate) || (b.v - a.v) || (b.p - a.p));
}

  kicker: '恭喜你开出了隐藏观察位',
  tagline: '先把事情看清楚，再决定站在哪里。',
  title: '你和她像在哪',
  desc: '你习惯先把不同说法放在一起看：核对细节、区分事实和感受，再追问每个人真正想要的是什么。你不急着站队，也不把和好当成唯一答案。你的优势是清醒、敏锐和判断力；但也要记得，关系里的对话并不总需要被分析到底，有时先让对方感到被听见，比继续追问更重要。',

  share: '我测出了《后会友期》里的隐藏观察位张泉灵，你也来试试？'
};
const OBS_TRIGGER = 9;

function showResult() {
  document.getElementById('loading').classList.remove('active');

  if (obsCount >= OBS_TRIGGER) {
    renderHiddenResult();
    return;
  }

  const rank = rankingOf();
  const c = CHARACTERS[rank[0].k];

  const resultEl = document.getElementById('result');
  resultEl.innerHTML = `
    <div class="r-tag">你的测试结果是</div>
    <img class="r-avatar" src="${c.avatar}" alt="${c.name}">
    <div class="r-char">${c.name}</div>
    <div class="r-name">${c.title}</div>
    <div class="r-title">"${c.tagline}"</div>
    <div class="result-card">
      <h3>你在友情里的样子</h3>
      <p>${c.desc}</p>
      <div class="traits">
        ${c.traits.map(t => `<span>${t}</span>`).join('')}
      </div>
      <p style="margin-top:14px;margin-bottom:0;font-size:12px;color:#8a8278;">人物标签只提炼节目已播内容中呈现的友情应对方式，不代表嘉宾完整的现实人格。</p>
    </div>
    <button class="btn-share" onclick="shareIt()">复制链接，发给朋友一起测</button>
    <button class="btn-again" onclick="restart()">再测一次</button>
  `;
  resultEl.classList.add('active');
  fitOneLine(resultEl.querySelector('.r-title'), 16, 10.5);
}

function fitOneLine(el, maxFs, minFs) {
  if (!el) return;
  let fs = maxFs;
  el.style.fontSize = fs + 'px';
  const limit = el.parentElement.clientWidth - 8;
  while (el.scrollWidth > limit && fs > minFs) {
    fs -= 0.5;
    el.style.fontSize = fs + 'px';
  }
}

function shareIt() {
  const topKey = rankingOf()[0].k;
  const txt = '我测出来是《后会友期》里的' + CHARACTERS[topKey].name + '，你也来测测？';
  const content = txt + ' ' + location.href;
  const done = () => {
    const btn = document.querySelector('.btn-share');
    const old = btn.textContent;
    btn.textContent = '已复制，去粘贴给朋友吧';
    setTimeout(() => { btn.textContent = old; }, 2000);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(content).then(done).catch(() => fallbackCopy(content, done));
  } else {
    fallbackCopy(content, done);
  }
}

function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); cb(); } catch (e) {}
  document.body.removeChild(ta);
}

function renderHiddenResult() {
  const h = HIDDEN_ZHANG;
  const resultEl = document.getElementById('result');
  resultEl.innerHTML = `
    <div class="h-kicker">${h.kicker}</div>
    <img class="h-avatar" src="${h.avatar}" alt="${h.name}">
    <div class="h-role">${h.role}</div>
    <div class="h-name">${h.name}</div>
    <div class="h-tagline">${h.tagline}</div>
    <div class="result-card">
      <h3>${h.title}</h3>
      <p>${h.desc}</p>
      <p style="margin-top:12px;color:var(--sub);font-size:13.5px;">${h.warn}</p>
      <div class="traits">
        ${h.traits.map(t => `<span>${t}</span>`).join('')}
      </div>
    </div>
    <button class="btn-share" onclick="shareHidden()">分享这个隐藏款</button>
    <button class="btn-again" onclick="restart()">再测一次</button>
  `;
  resultEl.classList.add('active');
  fitOneLine(resultEl.querySelector('.h-tagline'), 16, 10.5);
  window.scrollTo({ top: 0 });
}

function shareHidden() {
  const content = HIDDEN_ZHANG.share + ' ' + location.href;
  const done = () => {
    const btn = document.querySelector('.btn-share');
    const old = btn.textContent;
    btn.textContent = '已复制，去粘贴给朋友吧';
    setTimeout(() => { btn.textContent = old; }, 2000);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(content).then(done).catch(() => fallbackCopy(content, done));
  } else {
    fallbackCopy(content, done);
  }
}

function restart() {
  document.getElementById('result').classList.remove('active');
  document.getElementById('home').style.display = 'flex';
  window.scrollTo({ top: 0 });
}
</script>
